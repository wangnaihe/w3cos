name: Differential incremental layout regression

on:
  push:
    branches: [dot/bench-300-geometry-20261127]
    paths:
      - '.github/workflows/dot-bench-300-regression.yml'

permissions:
  contents: read
  actions: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      CARGO_INCREMENTAL: '0'
      W3COS_LAYOUT_NG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record revision and install prerequisites
        run: |
          git rev-parse HEAD
          printf 'Engine revision: %s\n' 9c07e1161378886a2d14efbf1bcb67b5eb2c0114
          printf '%s\n' "${ImageOS:-unknown} ${ImageVersion:-unknown}"
          lscpu
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxss-dev pkg-config libclang-dev cmake g++ libasound2-dev libudev-dev libsqlite3-dev
          rustup toolchain install --no-self-update
          rustc --version
      - name: Pin the test font
        run: |
          mkdir -p "$RUNNER_TEMP/growth-evidence"
          curl --fail --silent --show-error --location --max-time 60 \
            https://raw.githubusercontent.com/web-platform-tests/wpt/fa5393bb9f5f7d41cc16d1aeede1809ccd378ac0/fonts/Ahem.ttf \
            --output "$RUNNER_TEMP/Ahem.ttf"
          printf '%s  %s\n' b719ecb31c5b21fc573c03f6421c74ac63c271a5a3ff841e34f9705fb94b8448 "$RUNNER_TEMP/Ahem.ttf" | sha256sum --check
      - name: Gate the draft's Skia-only diagnostic for this CPU build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/retained_layers.rs")
          s = p.read_text()
          old = "        if crate::render_skia::paint_damage_trace() && !matches!(b.kind, ComponentKind::Text { .. })"
          assert s.count(old) == 1, "unexpected change to the pinned trace site"
          p.write_text(s.replace(old, '        #[cfg(feature = "skia")]\n' + old))
          PY
          git diff --check
          git diff -- crates/w3cos-runtime/src/retained_layers.rs | tee "$RUNNER_TEMP/growth-evidence/cpu-trace-guard.diff"
      - name: Reuse the original successful run's locked dependencies
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45951212053
          name: growth-geometry
          path: ${{ runner.temp }}/baseline-artifact
      - name: Stage the opt-in adaptive cutoff in this checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/incremental_layout_splice.rs")
          s = p.read_text()
          def one(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)

          one("""    let ranges_mode = if tail_shift_fast_mode() != 0 && super::preorder_hosts_mode() != 0 {
                  tail_shift_ranges_mode()
              } else {
                  0
              };
          """, "")
          one("    let by_range = match (preorder.as_deref(), hosts.as_deref(), moved_spans.as_ref()) {", """    // Experiment only. Width is in layout boxes, not unique DOM hosts.
              static DOT_ADAPTIVE: std::sync::OnceLock<Option<bool>> = std::sync::OnceLock::new();
              let adaptive = *DOT_ADAPTIVE.get_or_init(|| {
                  (std::env::var("DOT_LAYOUT_ADAPTIVE_SHIFT").as_deref() == Ok("1"))
                      .then(|| std::env::var_os("W3COS_SPLICE_VERIFY").is_some())
              });
              let use_index = adaptive.is_none_or(|audit| {
                  let width: usize = moved_spans
                      .as_ref()
                      .map_or(0, |spans| spans.iter().map(|&(a, b)| b - a).sum());
                  let selected = matches!(commit, PlanKind::Subtree(_)) && width >= 64;
                  if audit {
                      eprintln!("[dot-adaptive-shift] width={width} selected={selected}");
                  }
                  selected
              });
              let shift_fast = use_index && tail_shift_fast_mode() != 0;
              let ranges_mode = if shift_fast && super::preorder_hosts_mode() != 0 {
                  tail_shift_ranges_mode()
              } else {
                  0
              };
              let by_range = match (preorder.as_deref(), hosts.as_deref(), moved_spans.as_ref()) {""")
          one("(Some(sizes), Some(ids), Some(spans)) if ids.len() == sizes.len() => {",
              "(Some(sizes), Some(ids), Some(spans)) if use_index && ids.len() == sizes.len() => {")
          one("""    if shift_spans.is_none() || ranges_mode == 2 {
                  dedup_hosts(&mut shifted);
              }""", """    if shift_spans.is_none() || ranges_mode == 2 {
                  if use_index {
                      dedup_hosts(&mut shifted);
                  } else {
                      shifted.sort_unstable();
                      shifted.dedup();
                  }
              }""")
          one("} else if tail_shift_fast_mode() != 0 {\n            document.shift_layout_rects_y(&shifted, dh);",
              "} else if shift_fast {\n            document.shift_layout_rects_y(&shifted, dh);")
          one("pub(super) fn try_splice(\n", """fn dot_lazy_host_index() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| {
                  std::env::var("DOT_LAYOUT_LAZY_HOSTS").as_deref() == Ok("1")
                      && std::env::var("DOT_LAYOUT_ADAPTIVE_SHIFT").as_deref() == Ok("1")
              })
          }

          pub(super) fn try_splice(
          """)
          one("    let mut hosts = (super::preorder_hosts_mode() != 0).then(|| cache.component.take_hosts());",
              """    let mut hosts = if super::preorder_hosts_mode() == 0 {
                  None
              } else if dot_lazy_host_index() {
                  cache.component.hosts.take()
              } else {
                  Some(cache.component.take_hosts())
              };""")
          one("(hosts.is_some() || owners.is_some())",
              "(hosts.is_some() || owners.is_some() || dot_lazy_host_index())")
          one("    let shift_fast = use_index && tail_shift_fast_mode() != 0;", """    if use_index && hosts.is_none() && dot_lazy_host_index() && super::preorder_hosts_mode() != 0 {
                  *hosts = Some(cache.component.take_hosts());
                  if adaptive == Some(true) {
                      eprintln!("[dot-lazy-hosts] constructed");
                  }
              }
              let shift_fast = use_index && tail_shift_fast_mode() != 0;""")
          one("            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));",
              """            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));
                      if super::cssom_owner_index_mode() == 2 {
                          eprintln!("[dot-cssom-owner-range] used");
                      }""")
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/growth-evidence/adaptive-shift.diff"
      - name: Trace native commits only during the untimed geometry check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/incremental_layout.rs")
          s = p.read_text()
          entry = "fn note_flush(kind: &'static str, solved_nodes: u32, shifted_nodes: u32) {"
          assert s.count(entry) == 1
          s = s.replace(entry, """fn dot_stable_trace() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| std::env::var_os("DOT_STABLE_TRACE").is_some())
          }

          """ + entry + """
              if dot_stable_trace() {
                  eprintln!("[dot-stable-path] {kind} solved={solved_nodes} shifted={shifted_nodes}");
              }""")
          definite = "    if crate::definite_layout::try_apply() {"
          assert s.count(definite) == 1
          s = s.replace(definite, definite + """
                  if dot_stable_trace() {
                      eprintln!("[dot-stable-path] definite solved=0 shifted=0");
                  }""")
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/growth-evidence/stable-height.diff"
      - name: Defer the owner index in the opt-in arm and trace its life cycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/incremental_layout_splice.rs")
          s = p.read_text()
          def one(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)

          one("pub(super) fn try_splice(\n", """fn dot_lazy_owner_index() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| std::env::var("DOT_LAYOUT_LAZY_OWNER").as_deref() == Ok("1"))
          }

          pub(super) fn try_splice(
          """)
          one("    let mut owners = (super::cssom_owner_index_mode() != 0).then(|| cache.component.take_owners());", """    let mut owners = if super::cssom_owner_index_mode() == 0 {
                  None
              } else if dot_lazy_owner_index() {
                  cache.component.owners.take()
              } else {
                  let present = cache.component.owners.is_some();
                  let kept = cache.component.take_owners();
                  if !present && super::dot_stable_trace() {
                      eprintln!("[dot-owner] build-eager");
                  }
                  Some(kept)
              };
              if super::dot_stable_trace() {
                  eprintln!("[dot-owner] entry-present={}", owners.is_some());
              }""")
          one("(hosts.is_some() || owners.is_some() || dot_lazy_host_index())",
              "(hosts.is_some() || owners.is_some() || dot_lazy_host_index() || (dot_lazy_owner_index() && super::cssom_owner_index_mode() != 0))")
          one("    let owners_by_range = match (preorder.as_deref(), owners.as_deref(), moved_spans.as_ref()) {",
              """    // The speculative subtree solve has restored the retained component
              // tree. Both its preorder sizes and its old owner list are still
              // valid for these moved spans, before the commit below.
              if dot_lazy_owner_index() && super::cssom_owner_index_mode() != 0 && owners.is_none()
                  && !rebase && matches!(commit, PlanKind::Subtree(_))
              {
                  let width: usize = moved_spans.as_ref()
                      .map_or(0, |spans| spans.iter().map(|&(a, b)| b - a).sum());
                  if width >= 64 {
                      *owners = Some(cache.component.take_owners());
                      if super::dot_stable_trace() {
                          eprintln!("[dot-owner] build-late width={width}");
                      }
                  }
              }
              let owners_by_range = match (preorder.as_deref(), owners.as_deref(), moved_spans.as_ref()) {""")
          one("            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));",
              """            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));
                      if super::dot_stable_trace() {
                          eprintln!("[dot-owner] range");
                      }""")
          one("    index.splice(removed_start..removed_end, fresh);", """    index.splice(removed_start..removed_end, fresh);
              if super::dot_stable_trace() {
                  eprintln!("[dot-owner] update");
              }""")
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/growth-evidence/lazy-owner.diff"
      - name: Resolve the old preorder span once in the experimental Subtree arm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/incremental_layout_splice.rs")
          s = p.read_text()
          def one(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)

          one("    match commit {\n        PlanKind::Subtree(fresh) => {\n            // A subtree swap", "    match commit {\n        PlanKind::Subtree(fresh) => {\n            // A subtree swap")
          old = """                        splice_hosts(hosts, sizes, parent, at, 1, std::slice::from_ref(&fresh));
                                  splice_owners(owners, sizes, parent, at, 1, std::slice::from_ref(&fresh));
                                  splice_preorder(sizes, parent, at, 1, std::slice::from_ref(&fresh));"""
          one(old, """                        let inserted = std::slice::from_ref(&fresh);
                                  if dot_share_span() {
                                      // The sizes still describe the old tree. Do not mutate
                                      // them until both companion indexes use this old range.
                                      let (starts, begin, end) = preorder_span(sizes, parent, at, 1);
                                      splice_hosts_at(hosts, sizes.len(), begin, end, inserted);
                                      splice_owners_at(owners, sizes.len(), begin, end, inserted);
                                      splice_preorder_at(sizes, (starts, begin, end), inserted);
                                      if super::dot_stable_trace() {
                                          eprintln!("[dot-shared-span] subtree");
                                      }
                                  } else {
                                      splice_hosts(hosts, sizes, parent, at, 1, inserted);
                                      splice_owners(owners, sizes, parent, at, 1, inserted);
                                      splice_preorder(sizes, parent, at, 1, inserted);
                                  }""")
          one("/// Update preorder \x60sizes\x60 (still describing the old tree)", """fn dot_share_span() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| std::env::var("DOT_LAYOUT_SHARED_SPAN").as_deref() == Ok("1"))
          }

          /// Update preorder \x60sizes\x60 (still describing the old tree)""")
          one("""    let (starts, removed_start, removed_end) = preorder_span(sizes, path, keep, removed);
              let mut fresh = Vec::new();""", """    let span = preorder_span(sizes, path, keep, removed);
              splice_preorder_at(sizes, span, inserted);
          }

          fn splice_preorder_at(
              sizes: &mut Vec<u32>,
              (starts, removed_start, removed_end): (Vec<usize>, usize, usize),
              inserted: &[Component],
          ) {
              let mut fresh = Vec::new();""")
          for field, var, ty, make in [
              ("hosts", "ids", "Vec<u32>", "preorder_hosts_of"),
              ("owners", "index", "super::CssomOwnerIndex", "preorder_owners_of"),
          ]:
              one(f"""    let Some({var}) = {field}.as_mut() else {{
                  return;
              }};
              if {var}.len() != sizes.len() {{
                  *{field} = None;
                  return;
              }}
              let (_, removed_start, removed_end) = preorder_span(sizes, path, keep, removed);
              let mut fresh = Vec::new();
              for item in inserted {{
                  fresh.extend(super::{make}(item));
              }}""", f"""    match {field}.as_ref() {{
                  Some(kept) if kept.len() == sizes.len() => {{}}
                  Some(_) => {{
                      *{field} = None;
                      return;
                  }}
                  None => return,
              }}
              let (_, removed_start, removed_end) = preorder_span(sizes, path, keep, removed);
              splice_{field}_at({field}, sizes.len(), removed_start, removed_end, inserted);
          }}

          fn splice_{field}_at(
              {field}: &mut Option<{ty}>,
              old_len: usize,
              removed_start: usize,
              removed_end: usize,
              inserted: &[Component],
          ) {{
              let Some({var}) = {field}.as_mut() else {{
                  return;
              }};
              if {var}.len() != old_len {{
                  *{field} = None;
                  return;
              }}
              let mut fresh = Vec::new();
              for item in inserted {{
                  fresh.extend(super::{make}(item));
              }}""")
          one("    if preorder.is_none() {\n        *hosts = None;", """    if dot_share_span() && super::dot_stable_trace() && let Some(kept) = preorder.as_ref() {
                  assert_eq!(*kept, super::preorder_sizes_of(&cache.component));
                  if let Some(kept) = hosts.as_ref() {
                      assert_eq!(*kept, super::preorder_hosts_of(&cache.component));
                  }
                  if let Some(kept) = owners.as_ref() {
                      assert_eq!(*kept, super::preorder_owners_of(&cache.component));
                  }
                  eprintln!("[dot-shared-index-compare] sizes=true hosts={} owners={}", hosts.is_some(), owners.is_some());
              }
              if preorder.is_none() {
                  *hosts = None;""")
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/growth-evidence/shared-span.diff"
      - name: Verify the lock and build the CPU lib test executable
        run: |
          cp "$RUNNER_TEMP/baseline-artifact/Cargo.lock" Cargo.lock
          printf '%s  %s\n' 6a19e74d791979e02f90742dc9163686d65c1e083a23bf47e6bd124686229ee4 Cargo.lock | sha256sum --check
          cp Cargo.lock "$RUNNER_TEMP/growth-evidence/Cargo.lock"
          cargo test --locked --profile runtime-bench -p w3cos-runtime --lib --no-default-features --features cpu-render --no-run --message-format=json > "$RUNNER_TEMP/growth-evidence/cargo-test-build.jsonl"
      - name: Compare every selected incremental and definite layout test, one fresh process per entry
        run: |
          python3 - "$RUNNER_TEMP/growth-evidence" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          out = Path(sys.argv[1])
          built = []
          for line in (out / "cargo-test-build.jsonl").read_text().splitlines():
              obj = json.loads(line)
              if (obj.get("reason") == "compiler-artifact" and obj.get("executable")
                      and obj.get("profile", {}).get("test") and obj.get("target", {}).get("name") == "w3cos_runtime"):
                  built.append(obj["executable"])
          assert len(built) == 1, built
          exe = built[0]
          prefix = ("incremental_layout::", "definite_layout::")
          listed = subprocess.check_output([exe, "--list", "--format", "terse"], text=True, timeout=60)
          (out / "discovered-tests.txt").write_text(listed)
          targets = sorted(l[:-6] for l in listed.splitlines()
                           if l.endswith(": test") and l.startswith(prefix))
          assert len(targets) == len(set(targets)) and len(targets) >= 30, targets
          flags = ("W3COS_TAIL_SHIFT_FAST", "W3COS_PREORDER_HOSTS", "W3COS_TAIL_SHIFT_RANGES",
                   "W3COS_CSSOM_OWNER_INDEX", "DOT_LAYOUT_ADAPTIVE_SHIFT", "DOT_LAYOUT_LAZY_HOSTS",
                   "DOT_LAYOUT_LAZY_OWNER", "DOT_LAYOUT_SHARED_SPAN")
          results = {"default": {}, "candidate": {}}
          checks = re.compile(r"\[(cssom-owner-index|preorder-(hosts|sizes)|tail-shift-ranges)-verify\] mismatch")
          artifact = out / "test-logs"
          artifact.mkdir()
          for i, name in enumerate(targets):
              modes = ("default", "candidate") if i % 2 == 0 else ("candidate", "default")
              for mode in modes:
                  env = os.environ.copy()
                  env.update(dict.fromkeys(flags, "1" if mode == "candidate" else "0"))
                  env["W3COS_PREORDER_SIZES"] = "1"
                  for key in ("DOT_STABLE_TRACE", "W3COS_SPLICE_VERIFY", "W3COS_RETAIN_LOWERING_VERIFY"):
                      env.pop(key, None)
                  args = [exe, "--exact", name, "--nocapture", "--test-threads=1"]
                  try:
                      p = subprocess.run(args, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         text=True, errors="replace", timeout=45)
                      log = p.stdout
                      if checks.search(log):
                          state = "index-mismatch"
                      elif "test result: ok. 1 passed; 0 failed;" in log and p.returncode == 0:
                          state = "pass"
                      elif "test result: ok. 0 passed; 0 failed; 1 ignored;" in log and p.returncode == 0:
                          state = "ignored"
                      elif "test result: FAILED." in log:
                          state = "test-failure"
                      else:
                          state = "harness-error"
                  except subprocess.TimeoutExpired as err:
                      state = "timeout"
                      log = (err.stdout or b"").decode("utf-8", errors="replace")
                  (artifact / f"{i:03}-{mode}.log").write_text(log)
                  results[mode][name] = state
                  print(json.dumps(dict(phase="case", name=name, case=i, mode=mode, state=state)), flush=True)
          from collections import Counter
          states = {m: dict(Counter(r.values())) for m, r in results.items()}
          candidate_only = [n for n in targets if results["default"][n] == "pass" and results["candidate"][n] != "pass"]
          default_only = [n for n in targets if results["candidate"][n] == "pass" and results["default"][n] != "pass"]
          shared_nonpass = [n for n in targets
                            if results["candidate"][n] != "pass" and results["default"][n] != "pass"]
          errors = [(m, n) for m, r in results.items() for n, s in r.items()
                    if s in ("timeout", "harness-error", "index-mismatch")]
          summary = dict(phase="summary", discovered=len(targets), states=states, candidate_only=candidate_only,
                         default_only=default_only, shared_nonpass=shared_nonpass, errors=errors)
          (out / "differential.json").write_text(json.dumps(dict(summary=summary, results=results), indent=2))
          print(json.dumps(summary), flush=True)
          assert not candidate_only and not errors, summary
          PY
      - name: Archive the regression matrix and complete test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broader-layout-regression
          path: ${{ runner.temp }}/growth-evidence
          if-no-files-found: ignore
