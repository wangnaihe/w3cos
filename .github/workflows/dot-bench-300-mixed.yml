name: 300-card mixed-document qualification

on:
  push:
    branches: [dot/bench-300-geometry-20261127]
    paths:
      - '.github/workflows/dot-bench-300-mixed.yml'
      - 'crates/w3cos-runtime/examples/dot_layout_growth_mixed.rs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      W3COS_LAYOUT_NG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record revision and install prerequisites
        run: |
          git rev-parse HEAD
          printf 'Engine revision: %s\n' 9c07e1161378886a2d14efbf1bcb67b5eb2c0114
          printf '%s\n' "${ImageOS:-unknown} ${ImageVersion:-unknown}"
          lscpu
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxss-dev pkg-config libclang-dev cmake g++ libasound2-dev libudev-dev libsqlite3-dev
          rustup toolchain install --no-self-update
          rustc --version
      - name: Pin the test font
        run: |
          mkdir -p "$RUNNER_TEMP/growth-evidence"
          curl --fail --silent --show-error --location --max-time 60 \
            https://raw.githubusercontent.com/web-platform-tests/wpt/fa5393bb9f5f7d41cc16d1aeede1809ccd378ac0/fonts/Ahem.ttf \
            --output "$RUNNER_TEMP/Ahem.ttf"
          printf '%s  %s\n' b719ecb31c5b21fc573c03f6421c74ac63c271a5a3ff841e34f9705fb94b8448 "$RUNNER_TEMP/Ahem.ttf" | sha256sum --check
      - name: Gate the draft's Skia-only diagnostic for this CPU build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/retained_layers.rs")
          s = p.read_text()
          old = "        if crate::render_skia::paint_damage_trace() && !matches!(b.kind, ComponentKind::Text { .. })"
          assert s.count(old) == 1, "unexpected change to the pinned trace site"
          p.write_text(s.replace(old, '        #[cfg(feature = "skia")]\n' + old))
          PY
          git diff --check
          git diff -- crates/w3cos-runtime/src/retained_layers.rs | tee "$RUNNER_TEMP/growth-evidence/cpu-trace-guard.diff"
      - name: Reuse the original successful run's locked dependencies
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45951212053
          name: growth-geometry
          path: ${{ runner.temp }}/baseline-artifact
      - name: Stage the opt-in adaptive cutoff in this checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/incremental_layout_splice.rs")
          s = p.read_text()
          def one(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)

          one("""    let ranges_mode = if tail_shift_fast_mode() != 0 && super::preorder_hosts_mode() != 0 {
                  tail_shift_ranges_mode()
              } else {
                  0
              };
          """, "")
          one("    let by_range = match (preorder.as_deref(), hosts.as_deref(), moved_spans.as_ref()) {", """    // Experiment only. Width is in layout boxes, not unique DOM hosts.
              static DOT_ADAPTIVE: std::sync::OnceLock<Option<bool>> = std::sync::OnceLock::new();
              let adaptive = *DOT_ADAPTIVE.get_or_init(|| {
                  (std::env::var("DOT_LAYOUT_ADAPTIVE_SHIFT").as_deref() == Ok("1"))
                      .then(|| std::env::var_os("W3COS_SPLICE_VERIFY").is_some())
              });
              let use_index = adaptive.is_none_or(|audit| {
                  let width: usize = moved_spans
                      .as_ref()
                      .map_or(0, |spans| spans.iter().map(|&(a, b)| b - a).sum());
                  let selected = matches!(commit, PlanKind::Subtree(_)) && width >= 64;
                  if audit {
                      eprintln!("[dot-adaptive-shift] width={width} selected={selected}");
                  }
                  selected
              });
              let shift_fast = use_index && tail_shift_fast_mode() != 0;
              let ranges_mode = if shift_fast && super::preorder_hosts_mode() != 0 {
                  tail_shift_ranges_mode()
              } else {
                  0
              };
              let by_range = match (preorder.as_deref(), hosts.as_deref(), moved_spans.as_ref()) {""")
          one("(Some(sizes), Some(ids), Some(spans)) if ids.len() == sizes.len() => {",
              "(Some(sizes), Some(ids), Some(spans)) if use_index && ids.len() == sizes.len() => {")
          one("""    if shift_spans.is_none() || ranges_mode == 2 {
                  dedup_hosts(&mut shifted);
              }""", """    if shift_spans.is_none() || ranges_mode == 2 {
                  if use_index {
                      dedup_hosts(&mut shifted);
                  } else {
                      shifted.sort_unstable();
                      shifted.dedup();
                  }
              }""")
          one("} else if tail_shift_fast_mode() != 0 {\n            document.shift_layout_rects_y(&shifted, dh);",
              "} else if shift_fast {\n            document.shift_layout_rects_y(&shifted, dh);")
          one("pub(super) fn try_splice(\n", """fn dot_lazy_host_index() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| {
                  std::env::var("DOT_LAYOUT_LAZY_HOSTS").as_deref() == Ok("1")
                      && std::env::var("DOT_LAYOUT_ADAPTIVE_SHIFT").as_deref() == Ok("1")
              })
          }

          pub(super) fn try_splice(
          """)
          one("    let mut hosts = (super::preorder_hosts_mode() != 0).then(|| cache.component.take_hosts());",
              """    let mut hosts = if super::preorder_hosts_mode() == 0 {
                  None
              } else if dot_lazy_host_index() {
                  cache.component.hosts.take()
              } else {
                  Some(cache.component.take_hosts())
              };""")
          one("(hosts.is_some() || owners.is_some())",
              "(hosts.is_some() || owners.is_some() || dot_lazy_host_index())")
          one("    let shift_fast = use_index && tail_shift_fast_mode() != 0;", """    if use_index && hosts.is_none() && dot_lazy_host_index() && super::preorder_hosts_mode() != 0 {
                  *hosts = Some(cache.component.take_hosts());
                  if adaptive == Some(true) {
                      eprintln!("[dot-lazy-hosts] constructed");
                  }
              }
              let shift_fast = use_index && tail_shift_fast_mode() != 0;""")
          one("            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));",
              """            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));
                      if super::cssom_owner_index_mode() == 2 {
                          eprintln!("[dot-cssom-owner-range] used");
                      }""")
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/growth-evidence/adaptive-shift.diff"
      - name: Verify the lock and build the CPU fixture
        run: |
          cp "$RUNNER_TEMP/baseline-artifact/Cargo.lock" Cargo.lock
          printf '%s  %s\n' 6a19e74d791979e02f90742dc9163686d65c1e083a23bf47e6bd124686229ee4 Cargo.lock | sha256sum --check
          cp Cargo.lock "$RUNNER_TEMP/growth-evidence/Cargo.lock"
          cargo build --locked --profile runtime-bench -p w3cos-runtime --example dot_layout_growth_mixed --no-default-features --features cpu-render
      - name: Compare warm mixed geometry and sample tail after priming
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/Ahem.ttf" "$RUNNER_TEMP/growth-evidence" <<'PY'
          import json, os, pathlib, re, statistics, subprocess, sys
          font, out = sys.argv[1], pathlib.Path(sys.argv[2])
          exe = "target/runtime-bench/examples/dot_layout_growth_mixed"
          active = {"default": False, "lazy": True, "lazy-owner": True}
          def proc(variant, mode, verify=False):
              fast = active[variant]
              env = dict(os.environ)
              for k in ("W3COS_TAIL_SHIFT_FAST", "W3COS_PREORDER_HOSTS",
                        "DOT_LAYOUT_ADAPTIVE_SHIFT", "DOT_LAYOUT_LAZY_HOSTS"):
                  env[k] = "1" if fast else "0"
              env["W3COS_TAIL_SHIFT_RANGES"] = ("verify" if verify else "1") if fast else "0"
              env["W3COS_CSSOM_OWNER_INDEX"] = ("verify" if verify else "1") if variant == "lazy-owner" else "0"
              env.pop("W3COS_SPLICE_VERIFY", None)
              if verify:
                  env["W3COS_SPLICE_VERIFY"] = "1"
              p = subprocess.run([exe, font, mode], env=env, capture_output=True, text=True, timeout=45)
              if verify or p.returncode:
                  (out / f"{variant}-{mode}.json").write_text(p.stdout)
                  (out / f"{variant}-{mode}.stderr").write_text(p.stderr)
              if p.returncode:
                  print(p.stdout + p.stderr, file=sys.stderr, flush=True)
                  raise SystemExit(p.returncode)
              return json.loads(p.stdout), p.stderr

          for variant in active:
              j, log = proc(variant, "check", True)
              assert j["fresh_parity"] and len(j["edits"]) == 6, j
              assert [[r["tail_y"],r["tail_height"]] for r in j["edits"]] == [
                  [29900,40],[29920,40],[29920,20],[29900,20],[29900,40],[29900,20]], j
              parts = re.split(r"(?m)^\[mixed-phase\] edit=(\d+) pos=\d+ grow=(?:true|false)$", log)
              assert parts[1::2] == [str(i) for i in range(6)], log
              for i, receipt in enumerate(parts[2::2]):
                  rects = re.findall(r"(?m)^\[splice-verify\] root (\d+): \d+ rects, 0 mismatched$", receipt)
                  owners = re.findall(r"(?m)^\[splice-verify\] root (\d+): \d+ owners, 0 mismatched, 0 extra$", receipt)
                  assert len(rects) == 1 and owners == rects, (variant, i, receipt)
                  assert not re.search(r"full layout failed|[1-9]\d* mismatched|[1-9]\d* extra|\[(?:tail-shift-ranges|cssom-owner-index)-verify\] mismatch", receipt), receipt
                  if active[variant]:
                      expected = "true" if i in (1, 3) else "false"
                      assert re.findall(r"\[dot-adaptive-shift\] width=\d+ selected=(true|false)", receipt) == [expected], receipt
                      assert receipt.count("[dot-lazy-hosts] constructed") == int(i == 1), receipt
                  if variant == "lazy-owner":
                      assert receipt.count("[dot-cssom-owner-range] used") == 1, receipt
              if active[variant]:
                  assert "[verify-hit] W3COS_TAIL_SHIFT_RANGES" in log, log
              print(json.dumps(dict(phase="mixed-check", variant=variant, **j)), flush=True)

          arms = [(variant, prime) for variant in active for prime in ("primed","unprimed")]
          order = [arms[i:] + arms[:i] for i in range(len(arms))]
          order += [arm_order[::-1] for arm_order in order]
          rows = []
          with (out / "mixed-timing.jsonl").open("w", buffering=1) as f:
              for trial, arm_order in enumerate(order):
                  for variant, prime in arm_order:
                      j, _ = proc(variant, prime)
                      assert j["mode"] == prime and len(j["samples"]) == 20 and j["ops_per_batch"] == 128, j
                      row = dict(trial=trial, variant=variant, prime=prime, samples=j["samples"],
                                 wall_us=statistics.median(s["wall_ns"] for s in j["samples"])/128000,
                                 cpu_us=statistics.median(s["thread_cpu_ns"] for s in j["samples"])/128000)
                      rows.append(row)
                      f.write(json.dumps(row) + "\n")
          for variant, prime in arms:
              arm = [r for r in rows if (r["variant"], r["prime"]) == (variant, prime)]
              base = [r for r in rows if (r["variant"], r["prime"]) == ("default", prime)]
              assert len(arm) == len(base) == len(order)
              print(json.dumps(dict(phase="mixed-summary", variant=variant, prime=prime,
                                    wall_us=statistics.median(r["wall_us"] for r in arm),
                                    cpu_us=statistics.median(r["cpu_us"] for r in arm),
                                    versus_default_us=[a["wall_us"]-b["wall_us"] for a,b in zip(arm,base)])), flush=True)
          PY
      - name: Archive mixed qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-growth-evidence
          path: ${{ runner.temp }}/growth-evidence
          if-no-files-found: ignore
