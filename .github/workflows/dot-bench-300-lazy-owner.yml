name: Deferred CSSOM owner index qualification

on:
  push:
    branches: [dot/bench-300-geometry-20261127]
    paths:
      - '.github/workflows/dot-bench-300-lazy-owner.yml'

permissions:
  contents: read
  actions: read

jobs:
  lazy-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      W3COS_LAYOUT_NG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record revision and install prerequisites
        run: |
          git rev-parse HEAD
          printf 'Engine revision: %s\n' 9c07e1161378886a2d14efbf1bcb67b5eb2c0114
          printf '%s\n' "${ImageOS:-unknown} ${ImageVersion:-unknown}"
          lscpu
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxss-dev pkg-config libclang-dev cmake g++ libasound2-dev libudev-dev libsqlite3-dev
          rustup toolchain install --no-self-update
          rustc --version
      - name: Pin the test font
        run: |
          mkdir -p "$RUNNER_TEMP/growth-evidence"
          curl --fail --silent --show-error --location --max-time 60 \
            https://raw.githubusercontent.com/web-platform-tests/wpt/fa5393bb9f5f7d41cc16d1aeede1809ccd378ac0/fonts/Ahem.ttf \
            --output "$RUNNER_TEMP/Ahem.ttf"
          printf '%s  %s\n' b719ecb31c5b21fc573c03f6421c74ac63c271a5a3ff841e34f9705fb94b8448 "$RUNNER_TEMP/Ahem.ttf" | sha256sum --check
      - name: Gate the draft's Skia-only diagnostic for this CPU build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/retained_layers.rs")
          s = p.read_text()
          old = "        if crate::render_skia::paint_damage_trace() && !matches!(b.kind, ComponentKind::Text { .. })"
          assert s.count(old) == 1, "unexpected change to the pinned trace site"
          p.write_text(s.replace(old, '        #[cfg(feature = "skia")]\n' + old))
          PY
          git diff --check
          git diff -- crates/w3cos-runtime/src/retained_layers.rs | tee "$RUNNER_TEMP/growth-evidence/cpu-trace-guard.diff"
      - name: Reuse the original successful run's locked dependencies
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45951212053
          name: growth-geometry
          path: ${{ runner.temp }}/baseline-artifact
      - name: Stage the opt-in adaptive cutoff in this checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/incremental_layout_splice.rs")
          s = p.read_text()
          def one(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)

          one("""    let ranges_mode = if tail_shift_fast_mode() != 0 && super::preorder_hosts_mode() != 0 {
                  tail_shift_ranges_mode()
              } else {
                  0
              };
          """, "")
          one("    let by_range = match (preorder.as_deref(), hosts.as_deref(), moved_spans.as_ref()) {", """    // Experiment only. Width is in layout boxes, not unique DOM hosts.
              static DOT_ADAPTIVE: std::sync::OnceLock<Option<bool>> = std::sync::OnceLock::new();
              let adaptive = *DOT_ADAPTIVE.get_or_init(|| {
                  (std::env::var("DOT_LAYOUT_ADAPTIVE_SHIFT").as_deref() == Ok("1"))
                      .then(|| std::env::var_os("W3COS_SPLICE_VERIFY").is_some())
              });
              let use_index = adaptive.is_none_or(|audit| {
                  let width: usize = moved_spans
                      .as_ref()
                      .map_or(0, |spans| spans.iter().map(|&(a, b)| b - a).sum());
                  let selected = matches!(commit, PlanKind::Subtree(_)) && width >= 64;
                  if audit {
                      eprintln!("[dot-adaptive-shift] width={width} selected={selected}");
                  }
                  selected
              });
              let shift_fast = use_index && tail_shift_fast_mode() != 0;
              let ranges_mode = if shift_fast && super::preorder_hosts_mode() != 0 {
                  tail_shift_ranges_mode()
              } else {
                  0
              };
              let by_range = match (preorder.as_deref(), hosts.as_deref(), moved_spans.as_ref()) {""")
          one("(Some(sizes), Some(ids), Some(spans)) if ids.len() == sizes.len() => {",
              "(Some(sizes), Some(ids), Some(spans)) if use_index && ids.len() == sizes.len() => {")
          one("""    if shift_spans.is_none() || ranges_mode == 2 {
                  dedup_hosts(&mut shifted);
              }""", """    if shift_spans.is_none() || ranges_mode == 2 {
                  if use_index {
                      dedup_hosts(&mut shifted);
                  } else {
                      shifted.sort_unstable();
                      shifted.dedup();
                  }
              }""")
          one("} else if tail_shift_fast_mode() != 0 {\n            document.shift_layout_rects_y(&shifted, dh);",
              "} else if shift_fast {\n            document.shift_layout_rects_y(&shifted, dh);")
          one("pub(super) fn try_splice(\n", """fn dot_lazy_host_index() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| {
                  std::env::var("DOT_LAYOUT_LAZY_HOSTS").as_deref() == Ok("1")
                      && std::env::var("DOT_LAYOUT_ADAPTIVE_SHIFT").as_deref() == Ok("1")
              })
          }

          pub(super) fn try_splice(
          """)
          one("    let mut hosts = (super::preorder_hosts_mode() != 0).then(|| cache.component.take_hosts());",
              """    let mut hosts = if super::preorder_hosts_mode() == 0 {
                  None
              } else if dot_lazy_host_index() {
                  cache.component.hosts.take()
              } else {
                  Some(cache.component.take_hosts())
              };""")
          one("(hosts.is_some() || owners.is_some())",
              "(hosts.is_some() || owners.is_some() || dot_lazy_host_index())")
          one("    let shift_fast = use_index && tail_shift_fast_mode() != 0;", """    if use_index && hosts.is_none() && dot_lazy_host_index() && super::preorder_hosts_mode() != 0 {
                  *hosts = Some(cache.component.take_hosts());
                  if adaptive == Some(true) {
                      eprintln!("[dot-lazy-hosts] constructed");
                  }
              }
              let shift_fast = use_index && tail_shift_fast_mode() != 0;""")
          one("            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));",
              """            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));
                      if super::cssom_owner_index_mode() == 2 {
                          eprintln!("[dot-cssom-owner-range] used");
                      }""")
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/growth-evidence/adaptive-shift.diff"
      - name: Trace native commits only during the untimed geometry check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/incremental_layout.rs")
          s = p.read_text()
          entry = "fn note_flush(kind: &'static str, solved_nodes: u32, shifted_nodes: u32) {"
          assert s.count(entry) == 1
          s = s.replace(entry, """fn dot_stable_trace() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| std::env::var_os("DOT_STABLE_TRACE").is_some())
          }

          """ + entry + """
              if dot_stable_trace() {
                  eprintln!("[dot-stable-path] {kind} solved={solved_nodes} shifted={shifted_nodes}");
              }""")
          definite = "    if crate::definite_layout::try_apply() {"
          assert s.count(definite) == 1
          s = s.replace(definite, definite + """
                  if dot_stable_trace() {
                      eprintln!("[dot-stable-path] definite solved=0 shifted=0");
                  }""")
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/growth-evidence/stable-height.diff"
      - name: Defer the owner index in the opt-in arm and trace its life cycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-runtime/src/incremental_layout_splice.rs")
          s = p.read_text()
          def one(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new)

          one("pub(super) fn try_splice(\n", """fn dot_lazy_owner_index() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| std::env::var("DOT_LAYOUT_LAZY_OWNER").as_deref() == Ok("1"))
          }

          pub(super) fn try_splice(
          """)
          one("    let mut owners = (super::cssom_owner_index_mode() != 0).then(|| cache.component.take_owners());", """    let mut owners = if super::cssom_owner_index_mode() == 0 {
                  None
              } else if dot_lazy_owner_index() {
                  cache.component.owners.take()
              } else {
                  let present = cache.component.owners.is_some();
                  let kept = cache.component.take_owners();
                  if !present && super::dot_stable_trace() {
                      eprintln!("[dot-owner] build-eager");
                  }
                  Some(kept)
              };
              if super::dot_stable_trace() {
                  eprintln!("[dot-owner] entry-present={}", owners.is_some());
              }""")
          one("(hosts.is_some() || owners.is_some() || dot_lazy_host_index())",
              "(hosts.is_some() || owners.is_some() || dot_lazy_host_index() || (dot_lazy_owner_index() && super::cssom_owner_index_mode() != 0))")
          one("    let owners_by_range = match (preorder.as_deref(), owners.as_deref(), moved_spans.as_ref()) {",
              """    // The speculative subtree solve has restored the retained component
              // tree. Both its preorder sizes and its old owner list are still
              // valid for these moved spans, before the commit below.
              if dot_lazy_owner_index() && super::cssom_owner_index_mode() != 0 && owners.is_none()
                  && !rebase && matches!(commit, PlanKind::Subtree(_))
              {
                  let width: usize = moved_spans.as_ref()
                      .map_or(0, |spans| spans.iter().map(|&(a, b)| b - a).sum());
                  if width >= 64 {
                      *owners = Some(cache.component.take_owners());
                      if super::dot_stable_trace() {
                          eprintln!("[dot-owner] build-late width={width}");
                      }
                  }
              }
              let owners_by_range = match (preorder.as_deref(), owners.as_deref(), moved_spans.as_ref()) {""")
          one("            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));",
              """            super::CSSOM_OWNER_INDEX_RANGED.with(|n| n.set(n.get() + 1));
                      if super::dot_stable_trace() {
                          eprintln!("[dot-owner] range");
                      }""")
          one("    index.splice(removed_start..removed_end, fresh);", """    index.splice(removed_start..removed_end, fresh);
              if super::dot_stable_trace() {
                  eprintln!("[dot-owner] update");
              }""")
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/growth-evidence/lazy-owner.diff"
      - name: Verify the lock and build the CPU fixture
        run: |
          cp "$RUNNER_TEMP/baseline-artifact/Cargo.lock" Cargo.lock
          printf '%s  %s\n' 6a19e74d791979e02f90742dc9163686d65c1e083a23bf47e6bd124686229ee4 Cargo.lock | sha256sum --check
          cp Cargo.lock "$RUNNER_TEMP/growth-evidence/Cargo.lock"
          cargo build --locked --profile runtime-bench -p w3cos-runtime --example dot_layout_growth_lazy_owner --no-default-features --features cpu-render
      - name: Verify mixed fresh parity and time three separate mutation patterns
        run: |
          python3 - "$RUNNER_TEMP/Ahem.ttf" "$RUNNER_TEMP/growth-evidence" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from statistics import median
          import subprocess
          import sys

          font, evidence_dir = sys.argv[1:]
          out = Path(evidence_dir)
          exe = "target/runtime-bench/examples/dot_layout_growth_lazy_owner"
          variants = ("default", "eager-owner", "lazy-owner")
          modes = ("cold-tail", "primed-tail", "wide")
          flags = ("W3COS_TAIL_SHIFT_FAST", "W3COS_PREORDER_HOSTS", "W3COS_TAIL_SHIFT_RANGES",
                   "DOT_LAYOUT_ADAPTIVE_SHIFT", "DOT_LAYOUT_LAZY_HOSTS")

          def proc(variant, mode, round_name):
              env = os.environ.copy()
              candidate = variant != "default"
              verify = mode == "check"
              env.update(dict.fromkeys(flags, "1" if candidate else "0"))
              env["DOT_LAYOUT_LAZY_OWNER"] = str(int(variant == "lazy-owner"))
              env["W3COS_PREORDER_SIZES"] = "1"
              env["W3COS_CSSOM_OWNER_INDEX"] = ("verify" if verify else "1") if candidate else "0"
              env.pop("DOT_STABLE_TRACE", None)
              env.pop("W3COS_SPLICE_VERIFY", None)
              if verify:
                  env["DOT_STABLE_TRACE"] = "1"
              p = subprocess.run([exe, font, mode], env=env, capture_output=True, text=True, timeout=120)
              if verify or p.returncode:
                  (out / f"{variant}-{mode}-{round_name}.stderr").write_text(p.stderr)
              if p.returncode:
                  print(f"{variant}: {mode}: {p.stdout}\n{p.stderr}", file=sys.stderr)
                  raise SystemExit(p.returncode)
              return json.loads(p.stdout), p.stderr

          def emit(f, obj):
              line = json.dumps(obj, separators=(",", ":"))
              print(line, file=f, flush=True)
              if obj["phase"] != "trial":
                  print(line, flush=True)

          with (out / "lazy-owner.jsonl").open("w") as f:
              for variant in variants:
                  result, log = proc(variant, "check", "geometry")
                  assert result["fresh_parity"] and len(result["edits"]) == 6, result
                  assert not re.search(r"\[cssom-owner-index-verify\] mismatch", log), log
                  phases = re.split(r"(?m)^\[mixed-phase\] edit=(\d+)$", log)
                  assert phases[1::2] == list("012345"), log
                  for phase, receipt in zip(phases[1::2], phases[2::2]):
                      i = int(phase)
                      wide = i in (1, 3)
                      paths = re.findall(r"(?m)^\[dot-stable-path\] (\w+) solved=(\d+) shifted=(\d+)$", receipt)
                      assert paths == [("splice", "2", "4797" if wide else "0")], receipt
                      events = re.findall(r"(?m)^\[dot-owner\] (.*)$", receipt)
                      if variant == "default":
                          expected = ["entry-present=false"]
                      elif variant == "eager-owner":
                          expected = (["build-eager"] if i == 0 else []) + ["entry-present=true"]
                      else:
                          expected = ["entry-present=" + ("true" if i > 1 else "false")]
                          if i == 1:
                              expected += ["build-late width=4797"]
                      if variant != "default" and wide:
                          expected.append("range")
                      if variant == "eager-owner" or (variant == "lazy-owner" and i >= 1):
                          expected.append("update")
                      assert events == expected, (variant, i, expected, events, receipt)
                      emit(f, dict(phase="verified", variant=variant, edit=i, path=paths[0],
                                   events=events, tail_rect=result["edits"][i]["tail_rect"]))

              # All six execution orders. Cold-tail here means the document has never
              # moved followers: the reported loop is still warmed up normally.
              orders = [(0,1,2), (1,2,0), (2,0,1), (2,1,0), (1,0,2), (0,2,1)]
              for m, mode in enumerate(modes):
                  cells = {v: [] for v in variants}
                  for r in range(len(orders)):
                      for slot, idx in enumerate(orders[(r+m) % len(orders)]):
                          name = variants[idx]
                          j, _ = proc(name, mode, str(r))
                          ops = j["ops_per_batch"]
                          raw = j["samples"]
                          assert j["mode"] == mode and ops == (32 if mode == "wide" else 128) and len(raw) == 20, j
                          wall = median(a["wall_ns"] / ops for a in raw)
                          cpu = median(a["thread_cpu_ns"] / ops for a in raw)
                          first = j["first_wide"]
                          assert (first is None) == (mode == "cold-tail"), j
                          cells[name].append((wall, cpu, first))
                          emit(f, dict(phase="trial", mode=mode, variant=name, round=r, slot=slot,
                                       wall_ns=wall, cpu_ns=cpu, first_wide=first, samples=raw))
                  for name in variants:
                      wall, cpu, first = zip(*cells[name])
                      emit(f, dict(phase="summary", mode=mode, variant=name, wall_ns=median(wall),
                                   cpu_ns=median(cpu), first_wall_ns=None if first[0] is None else median(t[0] for t in first),
                                   first_cpu_ns=None if first[0] is None else median(t[1] for t in first),
                                   delta_default=[a-b[0] for a,b in zip(wall,cells["default"])],
                                   delta_eager=[a-b[0] for a,b in zip(wall,cells["eager-owner"])]))
          PY
      - name: Archive same-height evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-owner-evidence
          path: ${{ runner.temp }}/growth-evidence
          if-no-files-found: ignore
