name: Main-derived batch rectangle benchmark

on:
  push:
    branches: [dot/main-rect-batch-20261127]
    paths:
      - '.github/workflows/dot-main-rect-batch.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      W3COS_LAYOUT_NG: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Install baseline dependencies and pin the test font
        run: |
          git rev-parse HEAD
          git diff --name-only 0d713996f8ecf520b84b26797f0710cc41f7a1d8 HEAD
          git diff --exit-code 0d713996f8ecf520b84b26797f0710cc41f7a1d8 HEAD -- . ':!.github/workflows/dot-main-rect-batch.yml' ':!crates/w3cos-runtime/examples/dot_main_batch_rect.rs'
          printf '%s\n' "$ImageOS $ImageVersion"
          lscpu
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxss-dev pkg-config libclang-dev cmake g++ libasound2-dev libudev-dev libsqlite3-dev
          rustup toolchain install --no-self-update
          mkdir -p "$RUNNER_TEMP/main-rect-evidence"
          curl --fail --silent --show-error --location --max-time 60 \
            https://raw.githubusercontent.com/web-platform-tests/wpt/fa5393bb9f5f7d41cc16d1aeede1809ccd378ac0/fonts/Ahem.ttf \
            --output "$RUNNER_TEMP/Ahem.ttf"
          printf '%s  %s\n' b719ecb31c5b21fc573c03f6421c74ac63c271a5a3ff841e34f9705fb94b8448 "$RUNNER_TEMP/Ahem.ttf" | sha256sum --check
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cp Cargo.lock "$RUNNER_TEMP/main-rect-evidence/Cargo.lock"
          sha256sum Cargo.lock
      - name: Stage the opt-in equivalent batch consumer in the runner checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/w3cos-dom/src/document.rs")
          s = p.read_text()
          place = "    fn mark_extent_dirty(&mut self, id: NodeId) {"
          assert s.count(place) == 1
          p.write_text(s.replace(place, """    /// Experimental batch consumer preserving main's per-valid-write epoch
              /// values and full rectangle equality for extent invalidation.
              pub fn dot_batch_shift_layout_rects_y(&mut self, ids: &[u32], dy: f32) -> u64 {
                  let mut writes = 0u64;
                  for &id in ids {
                      let Some(rect) = self.layout_rects.get_mut(id as usize) else {
                          continue;
                      };
                      let before = *rect;
                      rect.y += dy;
                      let moved = *rect != before;
                      writes = writes.wrapping_add(1);
                      if moved {
                          self.mark_extent_dirty(NodeId(id));
                      }
                  }
                  // This exclusive borrow covers all writes. No epoch consumer
                  // runs inside the loop; mark_extent_dirty itself does not read it.
                  self.geometry_epoch = self.geometry_epoch.wrapping_add(writes);
                  writes
              }
          """ + place))

          p = Path("crates/w3cos-runtime/src/incremental_layout_splice.rs")
          s = p.read_text()
          old = """        for id in shifted {
                      let id = NodeId::from_u32(id);
                      let mut rect = document.get_layout_rect(id);
                      rect.y += dh;
                      document.set_layout_rect(id, rect);
                  }"""
          assert s.count(old) == 2
          s = s.replace(old, """        if dot_main_batch() {
                      let audit = dot_main_batch_audit();
                      let before = if audit { document.geometry_epoch() } else { 0 };
                      let writes = document.dot_batch_shift_layout_rects_y(&shifted, dh);
                      if audit {
                          let delta = document.geometry_epoch().wrapping_sub(before);
                          assert_eq!(delta, writes);
                          eprintln!("[dot-main-batch] ids={} writes={writes} epoch={delta}", shifted.len());
                      }
                  } else {
                      let audit = dot_main_batch_audit();
                      let before = if audit { document.geometry_epoch() } else { 0 };
                      let count = shifted.len();
                      for id in shifted {
                          let id = NodeId::from_u32(id);
                          let mut rect = document.get_layout_rect(id);
                          rect.y += dh;
                          document.set_layout_rect(id, rect);
                      }
                      if audit {
                          let delta = document.geometry_epoch().wrapping_sub(before);
                          eprintln!("[dot-main-walk] ids={count} writes={delta} epoch={delta}");
                      }
                  }""")
          entry = "pub(super) fn try_splice(\n"
          assert s.count(entry) == 1
          s = s.replace(entry, """fn dot_main_batch() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| std::env::var("DOT_MAIN_RECT_BATCH").as_deref() == Ok("1"))
          }

          fn dot_main_batch_audit() -> bool {
              static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
              *ON.get_or_init(|| std::env::var_os("DOT_MAIN_RECT_AUDIT").is_some())
          }

          """ + entry)
          p.write_text(s)
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/main-rect-evidence/batch.diff"
      - name: Build baseline and candidate switches in a single CPU executable
        run: |
          cargo build --locked --profile runtime-bench -p w3cos-runtime --bin w3cos-runtime-bench --example dot_main_batch_rect --no-default-features --features cpu-render
      - name: Run the existing Main runtime benchmark and its LayoutNG checks
        run: |
          DOT_MAIN_RECT_BATCH=0 target/runtime-bench/w3cos-runtime-bench --output "$RUNNER_TEMP/main-rect-evidence/runtime-bench-main.json" --samples 3
          python3 scripts/check-runtime-bench.py --expect-layout-ng on "$RUNNER_TEMP/main-rect-evidence/runtime-bench-main.json"
      - name: Match fresh large and tiny edit geometry before balanced timing
        run: |
          python3 - "$RUNNER_TEMP/Ahem.ttf" "$RUNNER_TEMP/main-rect-evidence" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from statistics import median
          import subprocess
          import sys

          font, outdir = sys.argv[1:]
          out = Path(outdir)
          exe = "target/runtime-bench/examples/dot_main_batch_rect"
          modes = ("walk", "batch")
          cases = [(300, 0), (300, 299), (1200, 0), (1200, 1199)]

          def run(mode, n, pos, check, tag):
              env = dict(os.environ, DOT_MAIN_RECT_BATCH="1" if mode == "batch" else "0")
              env.pop("DOT_MAIN_RECT_AUDIT", None)
              if check:
                  env["DOT_MAIN_RECT_AUDIT"] = "1"
              args = [exe, font, str(n), str(pos)]
              if check:
                  args.append("check")
              p = subprocess.run(args, env=env, capture_output=True, text=True, timeout=90)
              (out / f"{mode}-{n}-{pos}-{tag}.stderr").write_text(p.stderr)
              if p.returncode:
                  print(p.stdout + p.stderr, file=sys.stderr, flush=True)
                  raise SystemExit(p.returncode)
              return json.loads(p.stdout), p.stderr

          shift_counts = {}
          for n, pos in cases:
              for mode in modes:
                  v, log = run(mode, n, pos, True, "check")
                  assert v["cold_parity"] and v["count"] == n and v["position"] == pos, v
                  phases = re.split(r"(?m)^\[growth-phase\] (grow|shrink)$", log)
                  assert phases[1::2] == ["grow", "shrink"], log
                  values = []
                  for phase, receipt in zip(phases[1::2], phases[2::2]):
                      runs = re.findall(rf"\[dot-main-{mode}\] ids=(\d+) writes=(\d+) epoch=(\d+)", receipt)
                      assert len(runs) == 1, receipt
                      ids, writes, epoch = map(int, runs[0])
                      assert ids == writes == epoch == v[phase]["shifted"], (v, receipt)
                      assert ids == 1 if pos else ids >= n, receipt
                      values.append(ids)
                  if (n, pos) in shift_counts:
                      assert values == shift_counts[n, pos], v
                  shift_counts[n, pos] = values
                  print(json.dumps(dict(phase="verified", count=n, pos=pos, mode=mode, shifted=values)), flush=True)

          with (out / "paired.jsonl").open("w") as f:
              for k, (n, pos) in enumerate(cases):
                  arms = {mode: [] for mode in modes}
                  for i in range(6):
                      for mode in modes[::(-1 if (i+k)%2 else 1)]:
                          v, _ = run(mode, n, pos, False, str(i))
                          assert v["ops_per_batch"] == 128 and len(v["samples"]) == 20, v
                          ww = median(s["wall_ns"] / 128 for s in v["samples"])
                          cc = median(s["thread_cpu_ns"] / 128 for s in v["samples"])
                          arms[mode].append((ww, cc))
                          print(json.dumps(dict(n=n, pos=pos, mode=mode, i=i, wall=ww, cpu=cc, raw=v["samples"])), file=f, flush=True)
                  print(json.dumps(dict(phase="summary", count=n, pos=pos, shifted=shift_counts[n,pos],
                                        wall_ns={m:median(x[0] for x in a) for m,a in arms.items()},
                                        cpu_ns={m:median(x[1] for x in a) for m,a in arms.items()},
                                        paired_wall_ns=[b[0]-a[0] for a,b in zip(arms["walk"],arms["batch"])],
                                        paired_cpu_ns=[b[1]-a[1] for a,b in zip(arms["walk"],arms["batch"])])), flush=True)
          PY
      - name: Archive results and exact patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-rect-batch-evidence
          path: ${{ runner.temp }}/main-rect-evidence
          if-no-files-found: ignore
