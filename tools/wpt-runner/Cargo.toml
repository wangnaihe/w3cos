[package]
name = "w3cos-wpt-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pinned raw Web Platform Tests runner for W3COS"
publish = false

[[bin]]
name = "w3cos-wpt"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
image = { workspace = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
serde = { workspace = true }
serde_json = { workspace = true }
w3cos-core = { workspace = true }
w3cos-compiler = { workspace = true }
w3cos-dom = { workspace = true }
w3cos-runtime = { workspace = true, default-features = false, features = ["dynamic-js", "skia", "image-png", "image-jpeg", "image-webp", "image-gif", "image-bmp", "image-ico"] }

[dev-dependencies]
tempfile = { workspace = true }
