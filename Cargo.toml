[workspace]
resolver = "2"
members = [
    "tools/size-audit",
    "tools/size-probes",
    "crates/w3cos-ir",
    "crates/w3cos-vm",
    "crates/w3cos-core",
    "crates/w3cos-runtime",
    "crates/w3cos-compiler",
    "crates/w3cos-cli",
    "crates/w3cos-std",
    "crates/w3cos-dom",
    "crates/w3cos-a11y",
    "crates/w3cos-ai-bridge",
    "crates/w3cos-demo",
    "crates/w3cos-shell",
    "crates/w3cos-rn-compat",
    "crates/w3cos-ffi",
    "crates/w3cos-mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wangnaihe/w3cos"

[workspace.dependencies]
w3cos-ir = { path = "crates/w3cos-ir" }
w3cos-vm = { path = "crates/w3cos-vm" }
w3cos-core = { path = "crates/w3cos-core" }
w3cos-runtime = { path = "crates/w3cos-runtime", default-features = false }
w3cos-compiler = { path = "crates/w3cos-compiler" }
w3cos-std = { path = "crates/w3cos-std" }
w3cos-dom = { path = "crates/w3cos-dom" }
w3cos-a11y = { path = "crates/w3cos-a11y" }
w3cos-ai-bridge = { path = "crates/w3cos-ai-bridge" }
w3cos-rn-compat = { path = "crates/w3cos-rn-compat" }
w3cos-mobile = { path = "crates/w3cos-mobile" }
png = "0.17"
# Chromium-facing raster formats. Avoid linking scientific/authoring codecs
# (DDS/EXR/HDR/PNM/QOI/TGA/TIFF) into every standalone application.
image = { version = "0.25", default-features = false, features = [
    "avif",
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }
flate2 = "1.1"
wuff = "0.2.8"

# Layout: Taffy 0.9 — Flexbox + Grid + Block + position
taffy = { version = "0.9", features = ["std", "flexbox", "grid", "block_layout", "content_size"] }

# Text layout: Parley — line-breaking, shaping, bidi, inline boxes
parley = "0.7"
fontdue = "0.9"

# Rendering: Skia (Blink-aligned primary) + Vello/tiny-skia compatibility backends
vello = { path = "third_party/vello" }
skrifa = "0.36"
pollster = "0.4"
tiny-skia = "0.11"
kurbo = "0.13"
resvg = { version = "=0.45.1", default-features = false, features = ["text", "raster-images"] }

# Windowing
winit = "0.30"
softbuffer = "0.4"

# HTTP client for Fetch API
ureq = { version = "3", features = ["json"] }

# DevTools (Chrome DevTools Protocol over WebSocket)
tungstenite = "0.24"

# Native capability extensions
notify = { version = "7", features = ["macos_fsevent"] }
sysinfo = "0.33"
nix = { version = "0.29", features = ["process", "signal", "fs", "user", "mman", "mqueue"] }
tempfile = "3"
glob = "0.3"
libloading = "0.8"

# Core
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"
clap = { version = "4", features = ["derive"] }
object = { version = "0.37", default-features = false, features = ["read", "std"] }
url = "2"
psl = "2"

# Keep local debug builds useful without retaining full variable-level debug
# information in every dependency artifact. Automated gates additionally
# disable incremental compilation so repeated runs do not accumulate snapshots.
[profile.dev]
debug = 1
split-debuginfo = "packed"

[profile.test]
debug = 1
split-debuginfo = "packed"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"
