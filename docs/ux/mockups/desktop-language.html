<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>语言设置</title>
  <link rel="stylesheet" href="system.css?v=3" />
  <style>html,body{width:1440px;height:900px;overflow:hidden;}</style>
</head>
<body>
<div class="os">
      <div class="stage"><div class="window" style="left:340px;top:48px;width:760px;height:560px">
      <div class="titlebar"><i class="mark"></i><h2>设置</h2><div class="win-btns"><button class="win-btn" aria-label="最小化"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/></svg></button><button class="win-btn" aria-label="最大化"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button><button class="win-btn close" aria-label="关闭"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div></div>
      <div class="body-row">
        <nav class="side">
          <button>本机</button>
          <button>身份</button>
          <button class="active">语言</button>
          <button>设备</button>
        </nav>
        <div class="main" style="padding:16px 18px">
          <h3 style="font-size:20px">语言</h3>
          <p style="margin-top:6px">界面只用一种语言。收据里的原句不翻译。</p>
          <div class="lang-list"><div class="lang-row on"><span class="radio on"><i></i></span><div><b>跟随系统</b><span>现在解析为简体中文</span></div></div><div class="lang-row"><span class="radio"></span><div><b>简体中文</b><span>zh-CN · 内置</span></div></div><div class="lang-row pending"><span class="radio"></span><div><b>English</b><span>en · 内置</span></div><span class="pill stop">待确认</span></div><div class="lang-row"><span class="radio"></span><div><b>العربية</b><span>ar · 从右到左</span></div></div><div class="lang-row"><span class="radio"></span><div><b>עברית</b><span>he · 从右到左</span></div></div></div>
          <p class="fine">系统语言是简体中文。改成 English 要先确认。语言包放在本机，可以再加。</p>
        </div>
      </div>
    </div></div>
      
    <div class="intent-wrap">
      
      <section class="card" role="dialog" aria-label="确认切换语言">
        <span class="tier">L0 规则</span>
        <h3>把界面改成 English</h3>
        <p>只换界面上的句子。已经写下的收据保持原样，路径和时间格式跟 English。</p>
        <div class="actions">
          <button class="btn ghost">取消</button>
          <button class="btn primary">确认</button>
        </div>
      </section>
      <div class="intent">
        <input aria-label="意图" value="把界面改成 English" />
        <button class="go" aria-label="提议"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7v5.2A2.8 2.8 0 0 1 16.2 15H6"/><path d="M9.5 11.5 6 15l3.5 3.5"/></svg></button>
      </div>
    </div>
      
    <footer class="dock">
      <button class="dock-btn" aria-label="启动器"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg></button>
      
      <div class="spacer"></div>
      <div class="tray">
        <button class="dock-btn" aria-label="已锁定"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></button>
        <button class="dock-btn" aria-label="设备"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="8" rx="1.4"/><path d="M7 17.5h6M10 14v3.5"/><rect x="16" y="8" width="5" height="9" rx="1.2"/></svg></button>
        <button class="dock-btn" aria-label="通知"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5h12l-1.2-2V10.2a4.8 4.8 0 0 0-9.6 0v4.3L6 16.5Z"/><path d="M10 16.5a2 2 0 0 0 4 0"/></svg></button>
        <span class="l2flag">L2 关</span>
        <span class="clock">14:32</span>
      </div>
    </footer>
    </div>
</body>
</html>
