<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>手机通知</title>
  <link rel="stylesheet" href="system.css" />
  <style>html,body{width:390px;height:844px;overflow:hidden;}</style>
</head>
<body>
<div class="phone">
      <div class="status"><span>9:41</span><span class="right"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg> <span style="font-variant-numeric:tabular-nums">100%</span></span></div>
      <div class="phone-icons" style="opacity:.35">
        <button class="dicon"><span class="squircle jade"><svg class="ico" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.2A2 2 0 0 1 6 6.2h3.1L11 8.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8.2Z"/></svg></span><span>文件</span></button>
      </div>
      <section class="shade" aria-label="通知">
        <div class="grab"></div>
        <article class="note">
          <div class="bubble"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.2 4.2L19 7.2"/></svg></div>
          <div><b>已打开文件</b><span>收据 #128 · 点击查看</span></div>
        </article>
        <article class="note">
          <div class="bubble warn"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 20.5 19H3.5L12 4.5Z"/><path d="M12 10v4.5M12 17h.01"/></svg></div>
          <div><b>没有运行 echo</b><span>先解锁。拒绝已写入收据。</span></div>
        </article>
        <article class="note">
          <div class="bubble"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="11" rx="1.6"/><path d="M8 19.5h8M12 16v3.5"/></svg></div>
          <div><b>书桌想把文件交过来</b><span>路径和草稿。确认不会自动发生。</span></div>
        </article>
      </section>
      <div class="home-ind"></div>
    </div>
</body>
</html>
