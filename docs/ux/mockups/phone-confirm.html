<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>手机确认</title>
  <link rel="stylesheet" href="system.css" />
  <style>html,body{width:390px;height:844px;overflow:hidden;}</style>
</head>
<body>
<div class="phone">
      <div class="status"><span>9:41</span><span class="right"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg> <span style="font-variant-numeric:tabular-nums">100%</span></span></div>
      <div style="padding:8px 12px 0">
        <div class="window inplace">
          <div class="titlebar"><i class="mark"></i><h2>文件</h2><div class="win-btns"><button class="win-btn" aria-label="最小化"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/></svg></button><button class="win-btn" aria-label="最大化"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button><button class="win-btn close" aria-label="关闭"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div></div>
          <div class="main">
            <div class="file sel"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.2A2 2 0 0 1 6 6.2h3.1L11 8.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8.2Z"/></svg><span>w3cos</span><small>文件夹</small><small></small></div>
            <div class="file"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h6.5L18 8v12.5H7V3.5Z"/><path d="M13.5 3.5V8H18"/></svg><span>README.md</span><small>4 KB</small><small></small></div>
          </div>
        </div>
      </div>
      <section class="sheet-m" role="dialog" aria-label="确认">
        <div class="grab"></div>
        <span class="tier">L0 规则</span>
        <h3 style="margin:8px 0 4px;font-size:20px">打开文件</h3>
        <p>会离开当前页面，打开文件。不改动磁盘。</p>
        <div class="actions">
          <button class="btn ghost">取消</button>
          <button class="btn primary">确认</button>
        </div>
      </section>
    </div>
</body>
</html>
