<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>手机切换</title>
  <link rel="stylesheet" href="system.css?v=3" />
  <style>html,body{width:390px;height:844px;overflow:hidden;}</style>
</head>
<body>
<div class="phone" style="background:#0e141b">
      <div class="status"><span>9:41</span><span class="right"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg> <span style="font-variant-numeric:tabular-nums">100%</span></span></div>
      <div class="switcher">
        <article class="scard">
          <header><i class="mark"></i> 文件</header>
          <div class="fill">w3cos / README.md</div>
        </article>
        <article class="scard dim">
          <header><i class="mark amber"></i> 终端</header>
          <div class="fill">lin@书桌:~$</div>
        </article>
      </div>
      <p class="hint" style="position:absolute;left:0;right:0;bottom:92px">上滑一张卡片即可关闭。位置不带到别的设备。</p>
      <div class="bottom-intent">
        <div class="intent"><input aria-label="意图" placeholder="想做什么" /><button class="go" aria-label="提议"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7v5.2A2.8 2.8 0 0 1 16.2 15H6"/><path d="M9.5 11.5 6 15l3.5 3.5"/></svg></button></div>
      </div>
      <div class="home-ind"></div>
    </div>
</body>
</html>
