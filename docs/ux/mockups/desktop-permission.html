<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>权限</title>
  <link rel="stylesheet" href="system.css" />
  <style>html,body{width:1440px;height:900px;overflow:hidden;}</style>
</head>
<body>
<div class="os">
      <div class="stage"><div class="window" style="left:360px;top:96px;width:720px;height:460px">
      <div class="titlebar"><i class="mark amber"></i><h2>终端</h2><div class="win-btns"><button class="win-btn" aria-label="最小化"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/></svg></button><button class="win-btn" aria-label="最大化"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button><button class="win-btn close" aria-label="关闭"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div></div>
      <pre class="term"><span class="dim">只允许 echo、pwd、help。没有系统 shell。</span>
<span class="prompt">lin@书桌:~$</span> echo hello</pre>
    </div>
    <div class="scrim"></div>
    <section class="sheet" role="dialog" aria-label="权限">
      <span class="tier">需要额外能力</span>
      <h3>允许运行这一次 echo</h3>
      <p>这不是意图确认。确认「打开终端」已经完成。现在要单独授权进程能力，用完即收回。</p>
      <div class="cap">
        <div><b>进程</b><br />只放行 echo、pwd、help</div>
        <span>w3cos-process<br/>一次</span>
      </div>
      <div class="actions">
        <button class="btn danger">拒绝</button>
        <button class="btn primary">仅此一次</button>
      </div>
      <p class="fine">不提供「始终允许」。拒绝也会写收据。身份必须已解锁。</p>
    </section></div>
      
    <div class="intent-wrap">
      
      <div class="intent">
        <input aria-label="意图" value="echo hello" />
        <button class="go" aria-label="提议"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7v5.2A2.8 2.8 0 0 1 16.2 15H6"/><path d="M9.5 11.5 6 15l3.5 3.5"/></svg></button>
      </div>
    </div>
      
    <footer class="dock">
      <button class="dock-btn" aria-label="启动器"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg></button>
      <div class="running term on" aria-label="终端"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="13" rx="2"/><path d="M7.5 9.5 10 12l-2.5 2.5M12 14.5h4.5"/></svg></div>
      <div class="spacer"></div>
      <div class="tray">
        <button class="dock-btn" aria-label="已锁定"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></button>
        <button class="dock-btn" aria-label="设备"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="8" rx="1.4"/><path d="M7 17.5h6M10 14v3.5"/><rect x="16" y="8" width="5" height="9" rx="1.2"/></svg></button>
        <button class="dock-btn" aria-label="通知"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5h12l-1.2-2V10.2a4.8 4.8 0 0 0-9.6 0v4.3L6 16.5Z"/><path d="M10 16.5a2 2 0 0 0 4 0"/></svg></button>
        <span class="l2flag">L2 关</span>
        <span class="clock">14:32</span>
      </div>
    </footer>
    </div>
</body>
</html>
