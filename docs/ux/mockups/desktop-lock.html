<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>锁定</title>
  <link rel="stylesheet" href="system.css" />
  <style>html,body{width:1440px;height:900px;overflow:hidden;}</style>
</head>
<body>
<div class="os">
    <section class="lock-card">
      <div class="lock-seal"><svg class="ico" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></div>
      <h1>已锁定</h1>
      <p class="who">did:key:z6MkhaXg…ta2doK</p>
      <p>没有账号，也不走链。钥匙留在这台设备上。</p>
      <div style="margin-top:18px">
        <button class="btn primary block">用本机通行证解锁</button>
      </div>
      <p class="fine">解锁只影响这台设备。别的设备上的确认不会被一起放开。</p>
    </section></div>
</body>
</html>
