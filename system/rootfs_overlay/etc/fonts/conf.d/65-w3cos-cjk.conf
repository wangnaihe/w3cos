<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/usr/share/fonts/truetype/w3cos</dir>
  <!-- Accept, not prefer: Latin stays on the primary sans. Han and kana
       fall through to this face when the primary cmap has no glyph. -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Droid Sans Fallback</family>
    </accept>
  </alias>
</fontconfig>
