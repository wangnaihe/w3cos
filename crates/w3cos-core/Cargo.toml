[package]
name = "w3cos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "W3C OS core — JS value types, Proxy, and reactive primitives"

[features]
# Count arena slot retain/release calls (`page_arena::rc_op_counts`), for
# measuring refcount traffic. Off by default; costs one TLS add per op.
rc-stats = []
# Debug-only cycle detector / retainer dump (`w3cos_core::leak_detector`).
# Never compiled into release builds unless explicitly enabled; reports only,
# never frees.
leak-detector = []

[dependencies]
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
base64 = "0.22"
regex = "1"
fancy-regex = "0.18"
num-bigint = "0.4"
num-traits = "0.2"

[[example]]
name = "leak_report_demo"
required-features = ["leak-detector"]
