[package]
name = "w3cos-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "W3C OS Desktop Shell — the system-level GUI that replaces traditional desktop environments"

[[bin]]
name = "w3cos-shell"
path = "src/main.rs"

[features]
default = ["gpu"]
gpu = ["w3cos-runtime/gpu"]
cpu-render = ["w3cos-runtime/cpu-render"]
ai-bridge = ["w3cos-runtime/ai-bridge"]
# Pass-through. The shell still starts on w3cos-inferd until the runtime switch.
in-process-infer = ["w3cos-ai-bridge/in-process-infer"]

[dependencies]
chrono = { workspace = true, features = ["clock"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
w3cos-p2p = { path = "../w3cos-p2p" }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.2"
sha2 = "0.10"
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
w3cos-ai-bridge = { workspace = true, features = ["l1"] }
w3cos-ime = { path = "../w3cos-ime" }
w3cos-runtime = { workspace = true, default-features = false, features = ["web-sensors", "host-tray", "host-keyring"] }
w3cos-std = { workspace = true }
