[package]
name = "w3cos-ai-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "W3C OS AI bridge — structured DOM access, accessibility tree, and annotated screenshots for AI agents"

[[bin]]
name = "w3cos-ai-mcp"
path = "src/bin/w3cos-ai-mcp.rs"

[[bin]]
name = "w3cos-tool-host"
path = "src/bin/w3cos-tool-host.rs"

[features]
default = []
l1 = []
# Off unless a build asks for it. The default backend stays w3cos-inferd.
in-process-infer = []

[[bin]]
name = "w3cos-l2-bench"
path = "src/bin/w3cos-l2-bench.rs"

[dependencies]
w3cos-dom = { workspace = true }
w3cos-std = { workspace = true }
w3cos-a11y = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
getrandom = "0.3"
ring = "0.17"
bs58 = "0.5.1"
png = { workspace = true }
tiny-skia = { workspace = true }
fontdue = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
w3cos-p2p = { path = "../w3cos-p2p" }
