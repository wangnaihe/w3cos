[package]
name = "w3cos-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "W3C OS native runtime — layout engine, renderer, window manager, and system bridge"

[features]
default = ["gpu", "cpu-render", "skia", "web-graphics-advanced", "web-media-advanced", "web-serial"]
gpu = ["dep:vello", "dep:skrifa", "dep:pollster", "dep:bytemuck"]
cpu-render = ["dep:tiny-skia", "dep:softbuffer"]
skia = ["dep:skia-safe", "skia-safe/svg", "dep:rustybuzz", "dep:unicode-ccc"]
web-graphics-advanced = ["dep:naga"]
# Includes real-time Web Audio output and microphone capture through cpal
# on desktop targets.
web-media-advanced = ["dep:cpal"]
# Host serial ports for navigator.serial on macOS, Windows, and Linux desktop.
# libudev stays off so CI does not need libudev-dev; Linux USB ids come from sysfs.
web-serial = ["dep:serialport"]
# `image/avif` is an encoder backed by ravif/rav1e; it does not provide AVIF
# decoding. Keep it outside the ordinary browser/mobile raster closure until an
# application exposes an actual AVIF encoding surface.
image-avif-encode = ["image/avif"]
devtools = []
ai-bridge = ["dep:w3cos-ai-bridge"]
# Compile the desktop into this cdylib so /usr/bin/w3cos-shell can dlopen one runtime.
desktop = ["ai-bridge", "w3cos-ai-bridge/l1"]
dynamic-js = [
    "dep:w3cos-compiler",
    "dep:w3cos-ir",
    "dep:w3cos-vm",
    "dep:base64",
    "dep:wuff",
]
# Type-check the OHOS renderer on a non-OHOS host without pretending that the
# host libc has target_env="ohos". Production builds do not enable this.
ohos-check = ["skia", "skia-safe/gl"]

[dependencies]
w3cos-std = { workspace = true }
w3cos-abi = { workspace = true }
w3cos-dom = { workspace = true }
w3cos-core = { workspace = true }
w3cos-compiler = { workspace = true, optional = true }
w3cos-ir = { workspace = true, optional = true }
w3cos-vm = { workspace = true, optional = true }
url = { workspace = true }
base64 = { version = "0.22", optional = true }
ring = "0.17"
# WebGL GLSL validation uses the same naga as wgpu (web-graphics-advanced).
naga = { version = "28", features = ["glsl-in"], optional = true }
psl = { workspace = true }
w3cos-ai-bridge = { workspace = true, optional = true }
taffy = { workspace = true }
parley = { workspace = true }
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
fontdue = { workspace = true }
rustybuzz = { version = "=0.20.1", optional = true }
unicode-ccc = { version = "=0.4.0", optional = true }
fontdb = { version = "0.23", default-features = false, features = ["fs"] }
anyhow = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
encoding_rs = { workspace = true }
wuff = { workspace = true, optional = true }
resvg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
html-escape = { workspace = true }
libc = "0.2"
getrandom = "0.3"
tempfile = { workspace = true }
glob = { workspace = true }
w3cos-ffi = { path = "../w3cos-ffi" }
w3cos-a11y = { workspace = true }
# In-memory mock used by tests. The desktop `keyring` crate (below) opens the
# real Secret Service / Keychain / Credential Manager store.
keyring-core = "1.0"

# GPU rendering (default)
vello = { workspace = true, optional = true }
skrifa = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

# CPU rendering (fallback)
tiny-skia = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
skia-safe = { version = "=0.93.1", optional = true, features = ["vulkan"] }
ash = "0.38"
# Android does not expose SQLite as an NDK system library. Bundle the
# amalgamation so IndexedDB keeps its native SQLite persistence on mobile.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
winit = { workspace = true }
skia-safe = { version = "=0.93.1", optional = true, features = ["metal"] }
security-framework = "3.7"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5.2"
block2_05 = { package = "block2", version = "=0.5.1" }
objc2_06 = { package = "objc2", version = "0.6.3", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLCommandBuffer", "MTLCommandQueue", "MTLDrawable", "MTLPixelFormat"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["objc2-core-foundation", "objc2-metal", "CAMetalLayer"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["objc2-quartz-core", "UIView", "UIResponder"] }

[target.'cfg(all(not(target_os = "android"), not(target_os = "ios"), not(target_os = "macos"), not(target_env = "ohos")))'.dependencies]
winit = { workspace = true }
skia-safe = { version = "=0.93.1", optional = true }

[target.'cfg(target_env = "ohos")'.dependencies]
skia-safe = { version = "=0.93.1", optional = true, features = ["gl", "egl"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }

# Desktop-only system bridges. OHOS reports target_os="linux", so exclude it explicitly.
[target.'cfg(all(any(target_os = "macos", target_os = "linux", target_os = "windows"), not(target_env = "ohos")))'.dependencies]
ureq = { workspace = true }
notify-rust = "4"
arboard = { version = "3.6.1", default-features = false }
notify = { workspace = true }
sysinfo = { workspace = true }
nix = { workspace = true }
tempfile = { workspace = true }
glob = { workspace = true }
tungstenite = { workspace = true }
# rfd 0.15.4+ enables xdg-portal by default on Linux; that backend's build.rs
# requires an async runtime feature even when we only call the sync FileDialog API.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# Default `v1` feature: macOS Keychain, Windows Credential Manager, and the
# Secret Service over D-Bus (the service libsecret talks to) on Linux.
keyring = "4.2"
# Web Audio output and microphone input (ALSA/CoreAudio/WASAPI); see audio_device.rs and audio_input.rs.
cpal = { version = "0.15", optional = true }
# Web Serial. libudev is off so Linux CI does not need libudev-dev; USB
# vendor and product ids still come from sysfs on Linux.
serialport = { version = "4.10", default-features = false, optional = true }
# System tray. `ksni` is the Linux StatusNotifierItem backend (the protocol
# Ayatana AppIndicator implements) and does not need GTK. macOS uses
# NSStatusItem and Windows uses Shell_NotifyIcon inside the same crate.
# The default `libappindicator` feature links GTK and is intentionally off.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[dev-dependencies]
w3cos-core = { workspace = true }

[[example]]
name = "native_gaps"
required-features = ["cpu-render"]

# Mobile-friendly HTTP + DevTools CDP (Chrome remote debug via adb forward / sim localhost)
[target.'cfg(any(target_os = "ios", target_os = "android", target_env = "ohos"))'.dependencies]
ureq = { workspace = true }
tungstenite = { workspace = true }
